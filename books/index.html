<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework Library</title>
<link rel="stylesheet" href="hub.css">
<style>:root{--bg:#FBF8F3;--surface:#FFFFFF;--ink:#2B1714;--muted:#6B5752;--line:#EAE3D8;--primary:#2B1714;--secondary:#BFB065;--tertiary:#8DA28C}</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="kicker">Homework</p>
    <h1>Homework Library</h1>
    <p>Choose your book.</p>
  </header>
  <div class="shelf" id="shelf"></div>
</div>
<script>
/* To add a book: copy a line and change it. */
const BOOKS = [
  { title: 'Speakout C1–C2',  note: 'Unit 1 · Learning', href: 'speakout-c1-c2/',  colors: ['#5A1D22','#BFB065','#A9BFD4','#ECE7DC'] },
  { title: 'Life Vision B1+', note: 'Unit 7 · Education', href: 'life-vision-b1/',  colors: ['#3A230A','#A4530C','#8DA28C','#EEE9C1'] },
  { title: 'Outcomes A2/B1',  note: 'Unit 4 · Food',      href: 'outcomes-a2-b1/', colors: ['#8C2E3E','#867B18','#C9BE78','#EDE6D4'] }
];
document.getElementById('shelf').innerHTML = BOOKS.map(b => `
  <a class="book" href="${b.href}" style="background:${b.colors[0]};border-color:${b.colors[0]}">
    <div class="txt"><b>${b.title}</b><span>${b.note}</span></div>
  </a>`).join('');
</script>
</body>
</html>
