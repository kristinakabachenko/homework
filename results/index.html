<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Homework results</title>
<style>
:root{
  --bg:#fbf8f3; --surface:#fff; --ink:#2b1f16; --muted:#6e6252; --line:#e4dccd; --grid:#ece6da;
  --primary:#3A230A; --secondary:#A4530C; --tertiary:#8DA28C; --on-primary:#fff;
  --good:#2f8a4e; --mid:#b77a0a; --low:#c0392b; --goodbg:#e8f4ec; --midbg:#fbf1dc; --lowbg:#fbe9e6;
  --radius:18px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
a{color:inherit}
button,textarea{font:inherit}
.wrap{max-width:960px;margin:0 auto;padding:22px 16px 72px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* header */
.masthead{background:var(--primary);color:var(--on-primary);border-radius:24px;padding:26px 24px;margin-bottom:22px;position:relative;overflow:hidden}
.masthead::after{content:"";position:absolute;right:-46px;top:-46px;width:180px;height:180px;border-radius:50%;background:var(--secondary)}
.masthead::before{content:"";position:absolute;right:76px;bottom:-64px;width:120px;height:120px;border-radius:50%;background:var(--tertiary)}
.masthead>*{position:relative;z-index:1}
.kicker{font-size:12px;font-weight:700;opacity:.85;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.masthead h1{font-size:clamp(28px,6vw,42px);line-height:1.05;margin:0;max-width:75%}
.masthead p{margin:10px 0 0;max-width:68%;opacity:.92}
.crumbs{font-weight:700;font-size:14px;margin:0 0 14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--ink)}

.label{font-size:12px;font-weight:700;color:var(--muted);margin:26px 0 10px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}

/* stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile .v{font-size:32px;font-weight:700;line-height:1.1}
.tile .k{font-size:13px;color:var(--muted);margin-top:4px}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* homework list */
.list{display:grid;gap:10px}
.hw{display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hw:hover{transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(0,0,0,.45)}
.hw .t{font-weight:700;font-size:16px}
.hw .meta{font-size:13px;color:var(--muted);margin-top:2px}
.hw .grow{flex:1;min-width:0}
.ring{flex:none;width:58px;height:58px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
.pill.new{background:#fff3c4;color:#6b4e00}
.pill.ok{background:var(--goodbg);color:var(--good)}
.pill.g{background:var(--goodbg);color:var(--good)} .pill.m{background:var(--midbg);color:#7a5200} .pill.l{background:var(--lowbg);color:var(--low)}

/* detail */
.head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.head h2{margin:0;font-size:26px;line-height:1.15}
.big{font-size:46px;font-weight:700;line-height:1}
.btn{display:inline-block;border:0;background:var(--primary);color:var(--on-primary);border-radius:12px;padding:10px 16px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:minmax(90px,170px) 1fr 74px;gap:10px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--grid);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px}
.bar .n{text-align:right;font-weight:700}
.bar.jump{cursor:pointer}.bar.jump:hover .lab{text-decoration:underline}
.open{white-space:pre-wrap;font-size:15px;border-left:4px solid var(--secondary);background:#fffaf2}
.comment{border-left:4px solid var(--primary)}
.review textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.snap{margin-top:14px;padding:0;overflow:hidden}
.snap .sh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
.snap iframe{display:block;width:100%;border:0;height:120px;background:#fff}
.note{font-size:14px;color:var(--muted);background:#f4efe6;border-radius:12px;padding:12px 14px}

/* to do */
.todo{display:grid;gap:10px}
.todo a.card{display:flex;gap:14px;align-items:center;text-decoration:none;border:2px solid var(--secondary);transition:transform .15s}
.todo a.card:hover{transform:translateY(-2px)}
.todo .go{flex:none;width:46px;height:46px;border-radius:50%;background:var(--secondary);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:700}
.todo .t{font-weight:700;font-size:17px}
.todo .meta{font-size:13px;color:var(--muted)}
.todo .start{margin-left:auto;font-weight:700;font-size:14px;white-space:nowrap}

/* side skill */
.side{display:grid;gap:10px}
.sk{display:flex;gap:14px;align-items:center;text-decoration:none;border-left:6px solid var(--tertiary)}
.sk .ic{flex:none;width:52px;height:52px;border-radius:16px;background:#eef3ee;display:grid;place-items:center;font-size:28px}
.sk .grow{flex:1;min-width:0}
.sk .t{font-weight:700;font-size:17px}
.sk .meta{font-size:13px;color:var(--muted);margin-top:2px}
.sk .ptrack{height:10px;background:var(--grid);border-radius:99px;overflow:hidden;margin:9px 0 4px}
.sk .pfill{height:100%;border-radius:99px;background:var(--tertiary)}
.sk .pn{font-size:13px;font-weight:700}
.sk .acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.sk .go2{font-weight:700;font-size:14px;white-space:nowrap;text-decoration:none}
.views{display:flex;gap:6px;background:#efe8dc;border-radius:16px;padding:5px;margin:0 0 18px;width:max-content;max-width:100%}
.views a{text-decoration:none;font-weight:700;padding:9px 16px;border-radius:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.views a.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.views .cnt{font-size:12px;background:var(--tertiary);color:#fff;border-radius:99px;padding:1px 7px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0 12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.tgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tg{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}
.tg.done{background:var(--goodbg);color:var(--good)} .tg.prog{background:var(--midbg);color:#7a5200} .tg.new0{background:#efeae1;color:var(--muted)}
.tg.due0{background:#eef1f5;color:#44536a} .tg.soon{background:#fff3c4;color:#6b4e00} .tg.late{background:var(--lowbg);color:var(--low)}
.tagx{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:#eef3ee;color:#4b5f4a;margin-right:4px}

/* teacher home */
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.stu{text-decoration:none;display:block;border-top:6px solid var(--c)}
.stu h3{margin:0 0 2px;font-size:20px}
.copy{font-size:12px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer}
.err{max-width:520px;margin:60px auto;text-align:center}
.sr{position:absolute;left:-9999px}
@media (max-width:560px){ .masthead p{max-width:100%} .masthead::after{width:110px;height:110px;right:-40px;top:-40px} .masthead::before{width:80px;height:80px;right:40px;bottom:-50px} .hw{flex-wrap:wrap;row-gap:6px} .hw .grow{flex:1 1 calc(100% - 80px)} .hw .pill{margin-left:72px} .bar{grid-template-columns:90px 1fr 56px} .big{font-size:38px} }
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script>
/* ====== SETTINGS: the same web-app URL as in assets/hw-report.js ====== */
const API = 'https://script.google.com/macros/s/AKfycbzRiGs4VvXxrWnn2Mvp7uSl_ir-wuyIvJq2JEx10qHi80tMU_oyf1QED1IkYlLy777Veg/exec';
/* ====================================================================== */

const BOOKS = {
  'life vision': ['#3A230A','#A4530C','#8DA28C'],
  'outcomes':    ['#8C2E3E','#867B18','#C9BE78'],
  'speakout':    ['#5A1D22','#BFB065','#A9BFD4'],
  'english file':['#8A3B12','#D98A3D','#E8C9A0']
};
const Q = new URLSearchParams(location.search);
const TOKEN = Q.get('s') || '', KEY = Q.get('t') || '', DEMO = Q.has('demo');
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = x => x.max ? Math.round(x.score / x.max * 100) : 0;
const band = p => p >= 85 ? 'g' : p >= 65 ? 'm' : 'l';
const bandColor = p => ({g:'var(--good)', m:'var(--mid)', l:'var(--low)'})[band(p)];
const bandWord = p => ({g:'✓ Great', m:'● Good', l:'▲ Practise'})[band(p)];
const fmtDate = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}); };
const fmtDateLong = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}); };
const qs = extra => { const p = new URLSearchParams(); if (KEY) p.set('t', KEY); if (DEMO) p.set('demo',''); Object.entries(extra||{}).forEach(([k,v]) => v && p.set(k, v)); return '?' + p.toString().replace(/=(&|$)/g,'$1'); };

function theme(book){
  const b = String(book||'').toLowerCase(), k = Object.keys(BOOKS).find(k => b.includes(k));
  const c = k ? BOOKS[k] : ['#3A230A','#A4530C','#8DA28C'], r = document.documentElement.style;
  r.setProperty('--primary', c[0]); r.setProperty('--secondary', c[1]); r.setProperty('--tertiary', c[2]);
  return c[0];
}

/* ---------- data (JSONP + device cache) ---------- */
function api(params){
  if (DEMO) return Promise.resolve(demoApi(params));
  if (!API) return Promise.reject(new Error('setup'));
  return new Promise((ok, bad) => {
    const cb = 'cb' + Math.random().toString(36).slice(2), s = document.createElement('script');
    const p = new URLSearchParams(Object.assign({callback: cb}, params)); if (KEY) p.set('key', KEY);
    const t = setTimeout(() => { cleanup(); bad(new Error('timeout')); }, 25000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); d && d.ok ? ok(d) : bad(new Error(d && d.error || 'error')); };
    s.onerror = () => { cleanup(); bad(new Error('network')); };
    s.src = API + '?' + p; document.head.appendChild(s);
  });
}
function cached(name, params, render){
  const k = 'hwr:' + name;
  let had = false, old = null;
  try { old = localStorage.getItem(k); const c = JSON.parse(old || 'null'); if (c) { had = true; render(c, true); } } catch(e){}
  return api(params).then(d => { const s = JSON.stringify(d); try { localStorage.setItem(k, s); } catch(e){} if (s !== old) render(d, false); })
    .catch(e => { if (!had) fail(e); });
}
function fail(e){
  const m = e && e.message;
  $('#app').innerHTML = '<div class="err card"><h2>' + (m==='setup' ? 'Almost ready' : 'Can’t load results') + '</h2><p class="muted">' +
    (m==='setup' ? 'The results server is not connected yet.' : m==='student' || m==='auth' ? 'This link is not correct. Ask your teacher for your personal link.' : 'Check your internet and refresh the page.') + '</p></div>';
}

/* ---------- breakdown → bars ---------- */
function parseBreakdown(sub, snaps){
  if (snaps && snaps.some(s => s.max)) return snaps.filter(s => s.max).map(s => ({lab: exName(s.id), s:+s.s, max:+s.max, id:s.id}));
  const out = []; String(sub.breakdown||'').split('\n')[0].split('·').forEach(part => {
    const m = part.trim().match(/^(.*?)\s+(\d+)\s*\/\s*(\d+)/); if (m) out.push({lab: m[1].trim(), s:+m[2], max:+m[3], id: /^ex\d+$/i.test(m[1].trim()) ? m[1].trim().toLowerCase() : ''});
  });
  return out.sort((a,b) => (a.lab.match(/\d+/)||[99])[0] - (b.lab.match(/\d+/)||[99])[0] || 0);
}
const exName = id => /^step(\d+)$/i.test(id) ? 'Step ' + id.slice(4) : /^ex0$/i.test(id) ? 'Rules (first try)' : /^ex(\d+)$/i.test(id) ? 'Ex ' + id.slice(2) : id;

/* ---------- pieces ---------- */
function ring(p){
  const r = 24, c = 2*Math.PI*r;
  return '<svg class="ring" viewBox="0 0 58 58" role="img" aria-label="' + p + '%"><circle cx="29" cy="29" r="'+r+'" fill="none" stroke="var(--grid)" stroke-width="6"/>' +
    '<circle cx="29" cy="29" r="'+r+'" fill="none" stroke="'+bandColor(p)+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(c*p/100)+' '+c+'" transform="rotate(-90 29 29)"/>' +
    '<text x="29" y="33.5" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+p+'%</text></svg>';
}
function statusPill(x){ return x.status === 'checked' ? '<span class="pill ok">✓ Checked</span>' : '<span class="pill new">Waiting for check</span>'; }

function chart(subs){
  if (!subs.length) return '';
  const W = Math.round(Math.min(900, Math.max(340, (document.querySelector('.wrap')||{clientWidth:900}).clientWidth - 40))), H = W < 600 ? 230 : 260, L = 34, R = 10, T = 16, B = 34, n = subs.length;
  const step = (W - L - R) / n, bw = Math.max(10, Math.min(56, step - 8));
  const y = v => T + (H - T - B) * (1 - v/100);
  const avg = Math.round(subs.reduce((a,x) => a + pct(x), 0) / n);
  let g = '';
  [0,25,50,75,100].forEach(v => g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v?'#ece6da':'#c9bfae')+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="#6e6252">'+v+'</text>');
  subs.forEach((x,i) => {
    const p = pct(x), cx = L + step*i + step/2, top = y(Math.max(p,1)), h = y(0) - top, r = Math.min(4, bw/2, h);
    const d = 'M'+(cx-bw/2)+','+y(0)+' V'+(top+r)+' Q'+(cx-bw/2)+','+top+' '+(cx-bw/2+r)+','+top+' H'+(cx+bw/2-r)+' Q'+(cx+bw/2)+','+top+' '+(cx+bw/2)+','+(top+r)+' V'+y(0)+' Z';
    g += '<g class="mk" data-i="'+i+'" style="cursor:pointer"><rect x="'+(cx-step/2)+'" y="'+T+'" width="'+step+'" height="'+(H-T-B)+'" fill="transparent"/>' +
         '<path d="'+d+'" fill="'+bandColor(p)+'"/>' +
         (n <= 16 ? '<text x="'+cx+'" y="'+(top-6)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#2b1f16">'+p+'</text>' : '') +
         '<text x="'+cx+'" y="'+(H-B+16)+'" text-anchor="middle" font-size="11" fill="#6e6252">'+fmtDate(x.at)+'</text></g>';
  });
  g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(avg)+'" y2="'+y(avg)+'" stroke="#2b1f16" stroke-width="2" stroke-dasharray="5 5"/>' +
       '<text x="'+(W-R)+'" y="'+(y(avg)-6)+'" text-anchor="end" font-size="12" font-weight="700" fill="#2b1f16">average '+avg+'%</text>';
  return '<div class="card chart" id="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Score of each homework, in percent">'+g+'</svg><div class="tip"></div>' +
    '<div class="legend"><span><i style="background:var(--good)"></i>✓ 85–100% great</span><span><i style="background:var(--mid)"></i>● 65–84% good</span><span><i style="background:var(--low)"></i>▲ below 65% practise</span><span>- - average</span></div>' +
    '<table class="sr"><tr><th>Homework</th><th>Date</th><th>%</th></tr>' + subs.map(x => '<tr><td>'+esc(x.homework)+'</td><td>'+fmtDate(x.at)+'</td><td>'+pct(x)+'</td></tr>').join('') + '</table></div>';
}
function wireChart(subs, open){
  const c = $('#chart'); if (!c) return; const tip = c.querySelector('.tip');
  c.querySelectorAll('.mk').forEach(m => {
    const x = subs[+m.dataset.i];
    m.addEventListener('mousemove', e => { const b = c.getBoundingClientRect(); tip.innerHTML = '<b>'+esc(x.homework)+'</b><br>'+fmtDate(x.at)+' · '+x.score+'/'+x.max+' · '+pct(x)+'%';
      tip.style.left = Math.min(Math.max(e.clientX - b.left, 90), b.width - 90) + 'px'; tip.style.top = (e.clientY - b.top) + 'px'; tip.style.opacity = 1; });
    m.addEventListener('mouseleave', () => tip.style.opacity = 0);
    m.addEventListener('click', () => open(x.id));
  });
}

/* ---------- homework given (results/assignments.json) ---------- */
let ASSIGN = null;
function loadAssign(){
  if (ASSIGN) return Promise.resolve(ASSIGN);
  return fetch('assignments.json?v=' + Date.now()).then(r => r.json()).then(j => (ASSIGN = j)).catch(() => (ASSIGN = {}));
}
const fileOf = u => String(u||'').split('?')[0].split('#')[0].split('/').pop();
function todoOf(token, subs){
  const list = ((ASSIGN && ASSIGN[token]) || []).filter(a => a.type !== 'side');
  const sent = new Set(subs.map(x => fileOf(x.page)));
  return list.filter(a => !sent.has(fileOf(a.page)));
}
function todoBlock(token, name, subs){
  const t = todoOf(token, subs); if (!t.length) return '';
  return '<p class="label">To do (' + t.length + ')</p><div class="todo">' + t.map(a =>
    '<a class="card" href="../' + esc(a.page) + '?s=' + encodeURIComponent(name) + '"><span class="go" aria-hidden="true">✎</span><div><div class="t">' + esc(a.title) + '</div><div class="meta">' + esc(a.about || '') + (a.given ? (a.about ? ' · ' : '') + 'given ' + fmtDate(a.given) : '') + (a.due ? ' · due ' + fmtDate(a.due) : '') + '</div></div><span class="start">Start</span></a>').join('') + '</div>';
}

/* ---------- side skill (assignments with "type": "side") ---------- */
function sideFiles(){ const f = new Set(); Object.keys(ASSIGN||{}).forEach(k => Array.isArray(ASSIGN[k]) && ASSIGN[k].forEach(a => a.type === 'side' && f.add(fileOf(a.page)))); return f; }
const isSide = x => { const f = fileOf(x.page); return /^side-/.test(f) || sideFiles().has(f); };
function localProg(file){ try { return JSON.parse(localStorage.getItem('side:' + file) || 'null'); } catch(e){ return null; } }
function sideInfo(a, subs){
  const f = fileOf(a.page), last = subs.filter(x => fileOf(x.page) === f).sort((p,q) => new Date(q.at) - new Date(p.at))[0];
  const lp = KEY ? null : localProg(f);
  let done = last ? +last.score : 0, total = last ? +last.max : 0;
  if (lp && lp.total && (!last || new Date(lp.at) > new Date(last.at))) { done = lp.done; total = lp.total; }
  const p = total ? Math.round(done / total * 100) : 0;
  const status = total && done >= total ? 'done' : done ? 'progress' : 'new';
  const today = new Date(); today.setHours(0,0,0,0);
  const days = a.due ? Math.round((new Date(a.due + 'T00:00:00') - today) / 864e5) : null;
  return { a, last, done, total, p, status, days, unsent: status === 'done' && !(last && +last.score >= +last.max) };
}
function sideList(token, subs){ return ((ASSIGN && ASSIGN[token]) || []).filter(a => a.type === 'side').map(a => sideInfo(a, subs)); }
function views(on, nSide){
  if (!nSide) return '';
  return '<nav class="views"><a href="#"'+(on==='hw'?' class="on"':'')+'>📚 Homework</a><a href="#side"'+(on==='side'?' class="on"':'')+'>🧩 Side skill <span class="cnt">'+nSide+'</span></a></nav>';
}
const STATUS = { done:['done','✓ Done'], progress:['prog','● In progress'], new:['new0','○ Not started'] };
function dueTag(x){
  if (!x.a.due) return '';
  if (x.status === 'done') return '<span class="tg due0">📅 Deadline '+fmtDate(x.a.due)+'</span>';
  const d = x.days, cls = d < 0 ? 'late' : d <= 2 ? 'soon' : 'due0';
  const txt = d < 0 ? 'overdue by ' + (-d) + ' day' + (d === -1 ? '' : 's') : d === 0 ? 'today!' : d === 1 ? 'tomorrow' : d + ' days left';
  return '<span class="tg '+cls+'">📅 Deadline '+fmtDate(x.a.due)+' · '+txt+'</span>';
}
function sideCard(x, name){
  const a = x.a, st = STATUS[x.status];
  const skills = String(a.about || '').split('·').map(t => t.trim()).filter(Boolean).map(t => '<span class="tagx">'+esc(t)+'</span>').join('');
  return '<div class="card sk" data-st="'+x.status+'"><span class="ic" aria-hidden="true">'+esc(a.emoji || '📚')+'</span><div class="grow">' +
    '<div class="tgs"><span class="tg '+st[0]+'">'+st[1]+'</span>'+dueTag(x)+(x.unsent ? '<span class="tg soon">not sent yet</span>' : '')+(x.last && x.last.status === 'checked' ? '<span class="tg done">✓ checked by teacher</span>' : '')+'</div>' +
    '<div class="t">'+esc(a.title)+'</div><div class="meta">'+skills+(a.given ? ' given '+fmtDate(a.given) : '')+'</div>' +
    '<div class="ptrack"><div class="pfill" style="width:'+Math.max(x.p, x.done ? 3 : 0)+'%;'+(x.p >= 100 ? 'background:var(--good)' : '')+'"></div></div>' +
    '<div class="pn">'+(x.total ? x.done+'/'+x.total+' tasks · '+x.p+'%' : '0 tasks done')+(x.last ? ' · sent '+fmtDate(x.last.at) : '')+'</div></div>' +
    '<div class="acts"><a class="btn small" href="../'+esc(a.page)+'?s='+encodeURIComponent(name)+'">'+(x.status === 'done' ? 'Open' : x.done ? 'Continue' : 'Start')+'</a>' +
    (x.last ? '<a class="go2" href="#hw='+x.last.id+'">Answers →</a>' : '')+'</div></div>';
}
function sidePage(st, subs){
  const L = sideList(TOKEN, subs), order = {progress:0, new:1, done:2};
  L.sort((p,q) => order[p.status] - order[q.status] || (p.status === 'done' ? new Date(q.a.due||0) - new Date(p.a.due||0) : new Date(p.a.due||'2999') - new Date(q.a.due||'2999')));
  const nd = L.filter(x => x.status === 'done').length, np = L.filter(x => x.status === 'progress').length, nn = L.length - nd - np;
  const allT = L.reduce((s,x) => s + x.total, 0), allD = L.reduce((s,x) => s + x.done, 0);
  const next = L.filter(x => x.status !== 'done' && x.a.due).sort((p,q) => new Date(p.a.due) - new Date(q.a.due))[0];
  document.title = st.name + ' · Side skill';
  $('#app').innerHTML =
    (KEY ? '<div class="crumbs"><a href="'+qs()+'">← All students</a></div>' : '') +
    '<header class="masthead"><p class="kicker">'+esc(st.name)+' · Side skill</p><h1>Side skill</h1><p>Your own weekly work: real articles, videos, pronunciation and more. Do a little every day and finish before the deadline.</p></header>' +
    views('side', L.length) +
    '<div class="tiles">' +
      '<div class="card tile"><div class="v">'+(allT ? Math.round(allD/allT*100)+'%' : '0%')+'</div><div class="k">Overall progress</div></div>' +
      '<div class="card tile"><div class="v" style="color:var(--good)">'+nd+'</div><div class="k">Done</div></div>' +
      '<div class="card tile"><div class="v" style="color:var(--mid)">'+np+'</div><div class="k">In progress</div></div>' +
      '<div class="card tile"><div class="v">'+(next ? fmtDate(next.a.due) : '—')+'</div><div class="k">Next deadline'+(next ? ' · '+esc(next.a.title) : '')+'</div></div>' +
    '</div>' +
    '<div class="filters"><button class="on" data-f="all">All ('+L.length+')</button><button data-f="progress">In progress ('+np+')</button><button data-f="new">Not started ('+nn+')</button><button data-f="done">Done ('+nd+')</button></div>' +
    '<div class="side" id="sideList">' + (L.length ? L.map(x => sideCard(x, st.name)).join('') : '<div class="note">No side skill tasks yet.</div>') + '</div>';
  document.querySelectorAll('.filters button').forEach(b => b.onclick = () => {
    document.querySelectorAll('.filters button').forEach(o => o.classList.toggle('on', o === b));
    document.querySelectorAll('#sideList .sk').forEach(c => c.style.display = b.dataset.f === 'all' || c.dataset.st === b.dataset.f ? '' : 'none');
  });
  window.scrollTo(0, 0);
}

/* ---------- student page ---------- */
function studentPage(){
  cached('s:' + TOKEN, {action:'student', token:TOKEN}, d => {
    const st = d.student, allSubs = d.subs.slice().sort((a,b) => new Date(a.at) - new Date(b.at)), subs = allSubs.filter(x => !isSide(x));
    theme(st.book);
    const id = (location.hash.match(/hw=([^&]+)/)||[])[1];
    if (id) { const x = allSubs.find(s => s.id === id); if (x) return detail(st, x, d.teacher || !!KEY); }
    const nSide = sideList(TOKEN, allSubs).length;
    if (location.hash === '#side' && nSide) return sidePage(st, allSubs);
    document.title = st.name + ' · Homework results';
    const n = subs.length, avg = n ? Math.round(subs.reduce((a,x) => a + pct(x), 0)/n) : 0;
    const best = n ? Math.max.apply(null, subs.map(pct)) : 0;
    const last3 = subs.slice(-3), prev3 = subs.slice(-6,-3);
    const a3 = last3.length ? Math.round(last3.reduce((a,x)=>a+pct(x),0)/last3.length) : 0;
    const p3 = prev3.length ? Math.round(prev3.reduce((a,x)=>a+pct(x),0)/prev3.length) : null;
    const trend = p3 == null ? '—' : (a3 - p3 > 0 ? '↑ +' : a3 - p3 < 0 ? '↓ ' : '→ ') + (a3 - p3) + '%';
    const toCheck = subs.filter(x => x.status !== 'checked').length;
    const intro = st.intro || 'Here you can see all your homework and how well you did. Green is great, amber is good, red means “let’s practise this again”. Tap any homework to see your answers.';
    $('#app').innerHTML =
      (KEY ? '<div class="crumbs"><a href="'+qs()+'">← All students</a></div>' : '') +
      '<header class="masthead"><p class="kicker">'+esc(st.book)+' · Homework results</p><h1>Hi, '+esc(st.name)+'!</h1><p>'+esc(intro)+'</p></header>' +
      views('hw', nSide) +
      '<div class="tiles">' +
        '<div class="card tile"><div class="v" style="color:'+bandColor(avg)+'">'+(n?avg+'%':'—')+'</div><div class="k">Average score '+(n?'· '+bandWord(avg):'')+'</div></div>' +
        '<div class="card tile"><div class="v">'+n+'</div><div class="k">Homeworks done</div></div>' +
        '<div class="card tile"><div class="v">'+(n?best+'%':'—')+'</div><div class="k">Best result</div></div>' +
        '<div class="card tile"><div class="v">'+trend+'</div><div class="k">Last 3 vs 3 before</div></div>' +
        (KEY ? '<div class="card tile"><div class="v" style="color:#6b4e00">'+toCheck+'</div><div class="k">Waiting for your check</div></div>' : '') +
      '</div>' +
      todoBlock(TOKEN, st.name, subs) +
      (n ? '<p class="label">Progress tracker</p>' + chart(subs) : '') +
      '<p class="label">All homework</p><div class="list">' +
      (n ? subs.slice().reverse().map(x => { const p = pct(x);
        return '<a class="card hw" href="#hw='+x.id+'">'+ring(p)+'<div class="grow"><div class="t">'+esc(x.homework)+'</div><div class="meta">'+fmtDateLong(x.at)+' · '+x.score+'/'+x.max+' points</div></div>'+statusPill(x)+'</a>'; }).join('')
         : '<div class="note">' + (todoOf(TOKEN, subs).length ? 'When you send your homework, your results will appear here.' : 'No homework yet. When you send your first homework, it will appear here.') + '</div>') + '</div>';
    wireChart(subs, id => location.hash = 'hw=' + id);
    window.scrollTo(0, 0);
  });
}

/* ---------- one homework ---------- */
function detail(st, x, teacher){
  const p = pct(x);
  document.title = x.homework + ' · ' + st.name;
  $('#app').innerHTML =
    '<div class="crumbs">' + (KEY ? '<a href="'+qs()+'">All students</a><span>/</span>' : '') + (isSide(x) ? '<a href="#side">← Side skill</a>' : '<a href="#">← '+esc(st.name)+'’s results</a>')+'</div>' +
    '<div class="card head">'+ring(p).replace('class="ring"','class="ring" style="width:84px;height:84px"')+
      '<div style="flex:1;min-width:220px"><p class="kicker muted" style="margin:0 0 4px">'+esc(st.book)+'</p><h2>'+esc(x.homework)+'</h2>' +
      '<div class="muted small" style="margin-top:4px">'+fmtDateLong(x.at)+' · <b style="color:var(--ink)">'+x.score+'/'+x.max+'</b> '+(isSide(x) ? 'tasks done · Side skill' : 'points · '+bandWord(p))+'</div>' +
      '<div class="row" style="margin-top:10px">'+statusPill(x)+(x.page ? '<a class="btn ghost small" href="'+esc(x.page)+'" target="_blank" rel="noopener">Open homework ↗</a>' : '')+'</div></div></div>' +
    '<p class="label">'+(isSide(x) ? 'Tasks done by step' : 'Score by exercise')+'</p><div class="card bars" id="bars"><span class="muted small">Loading…</span></div>' +
    (x.open ? '<p class="label">Open answers — to read</p><div class="card open">'+esc(x.open)+'</div>' : '') +
    (teacher ? reviewBox(x) : (x.comment ? '<p class="label">Teacher’s comment</p><div class="card comment" style="white-space:pre-wrap">'+esc(x.comment)+'</div>' : '')) +
    '<p class="label">Answers, as you saw them</p><div id="snaps"><div class="note">Loading answers…</div></div>';
  window.scrollTo(0, 0);
  if (teacher) wireReview(x);
  api({action:'snaps', id:x.id, token:TOKEN}).then(d => { bars(x, d.snaps); snapshots(x, d.snaps); })
    .catch(() => { bars(x, []); snapshots(x, []); });
}
function bars(x, snaps){
  const b = parseBreakdown(x, snaps);
  $('#bars').innerHTML = b.length ? b.map(r => { const p = r.max ? Math.round(r.s/r.max*100) : 0;
    return '<div class="bar'+(r.id && snaps.some(s=>s.id===r.id) ? ' jump" data-id="'+r.id : '')+'"><span class="lab">'+esc(r.lab)+'</span><div class="track"><div class="fill" style="width:'+Math.max(p,2)+'%;background:'+bandColor(p)+'"></div></div><span class="n">'+r.s+'/'+r.max+'</span></div>'; }).join('')
    : '<span class="muted small">No score details.</span>';
  document.querySelectorAll('.bar.jump').forEach(el => el.onclick = () => { const t = document.getElementById('snap-'+el.dataset.id); t && t.scrollIntoView({behavior:'smooth'}); });
}
const cssCache = {};
function pageCss(url){
  if (!url) return Promise.resolve('');
  if (!cssCache[url]) cssCache[url] = fetch(url.replace(/^https?:\/\/[^/]+\/(homework\/)?/, '../'))
    .then(r => r.text()).then(h => (h.match(/<style[^>]*>[\s\S]*?<\/style>/gi) || []).join('\n')).catch(() => '');
  return cssCache[url];
}
function snapshots(x, snaps){
  const box = $('#snaps');
  if (!snaps.length){ box.innerHTML = '<div class="note">Pictures of the answers are saved for homework sent after 7 November 2026. For this one you can see the score by exercise and the open answers above.</div>'; return; }
  box.innerHTML = snaps.map(s => { const has = s.max != null && s.max !== ''; const p = has && +s.max ? Math.round(s.s/s.max*100) : null;
    return '<div class="card snap" id="snap-'+esc(s.id)+'"><div class="sh"><span>'+esc(exName(s.id))+(s.title && s.title !== s.id ? ' · <span class="muted" style="font-weight:400">'+esc(s.title)+'</span>' : '')+'</span>' +
      (p != null ? '<span class="pill '+band(p)+'">'+(/^step/i.test(s.id) ? 'Done '+s.s+'/'+s.max : 'First try '+s.s+'/'+s.max)+'</span>' : '<span class="pill new">Open task</span>')+'</div><iframe title="'+esc(exName(s.id))+'" loading="lazy"></iframe></div>'; }).join('');
  pageCss(x.page).then(css => {
    box.querySelectorAll('iframe').forEach((f, i) => {
      f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><base href="'+esc(x.page)+'">'+css+
        '<style>html,body{background:#fff!important;margin:0!important;padding:0!important}body{pointer-events:none;padding:10px!important}.wrap,.page,main{max-width:none!important;margin:0!important;padding:0!important}' +
        'section,.card{display:block!important;margin:0!important;box-shadow:none!important;border:0!important;opacity:1!important}.hidden{display:revert}</style></head><body><div class="wrap">'+snaps[i].html+'</div></body></html>';
      const fit = () => { try { f.style.height = (f.contentDocument.documentElement.scrollHeight + 4) + 'px'; } catch(e){} };
      f.onload = () => { fit(); setTimeout(fit, 400); setTimeout(fit, 1500); };
    });
  });
}
function reviewBox(x){
  return '<p class="label">Your check (only you can edit this)</p><div class="card review"><textarea id="cm" placeholder="Comment for the student (they will see it)…">'+esc(x.comment||'')+'</textarea>' +
    '<div class="row" style="margin-top:10px"><button class="btn" id="ck">'+(x.status==='checked'?'Save comment':'✓ Mark as checked')+'</button>' +
    (x.status==='checked' ? '<button class="btn ghost" id="unck">Mark as not checked</button>' : '') + '<span class="muted small" id="rv"></span></div></div>';
}
function wireReview(x){
  const save = status => { $('#ck').disabled = true; $('#rv').textContent = 'Saving…';
    api({action:'review', id:x.id, status:status, comment:$('#cm').value}).then(() => {
      x.status = status; x.comment = $('#cm').value; try { Object.keys(localStorage).filter(k => k.startsWith('hwr:')).forEach(k => localStorage.removeItem(k)); } catch(e){}
      $('#rv').textContent = 'Saved ✓'; $('#ck').disabled = false;
      document.querySelectorAll('.head .pill').forEach(p => p.outerHTML = statusPill(x));
    }).catch(() => { $('#rv').textContent = 'Not saved, try again'; $('#ck').disabled = false; }); };
  $('#ck').onclick = () => save('checked');
  const u = $('#unck'); if (u) u.onclick = () => save('');
}

/* ---------- teacher home ---------- */
function teacherPage(){
  cached('t', {action:'teacher'}, d => {
    document.title = 'Homework results · Teacher';
    theme('');
    const by = {}; d.students.forEach(s => by[s.name] = []);
    const lost = []; d.subs.forEach(x => (by[x.who] ? by[x.who].push(x) : lost.push(x)));
    const recent = d.subs.filter(x => x.status !== 'checked' && by[x.who]).sort((a,b) => new Date(b.at) - new Date(a.at));
    const base = location.origin + location.pathname;
    $('#app').innerHTML =
      '<header class="masthead"><p class="kicker">moody · teacher</p><h1>Homework results</h1><p>'+recent.length+' homework'+(recent.length===1?'':'s')+' waiting for your check.</p></header>' +
      (recent.length ? '<p class="label">To check</p><div class="list">' + recent.map(x => { const s = d.students.find(s => s.name === x.who), p = pct(x);
        return '<a class="card hw" href="'+qs({s:s.token})+'#hw='+x.id+'">'+ring(p)+'<div class="grow"><div class="t">'+esc(x.homework)+'</div><div class="meta"><b>'+esc(x.who)+'</b> · '+fmtDateLong(x.at)+' · '+x.score+'/'+x.max+'</div></div><span class="pill new">Check →</span></a>'; }).join('') + '</div>' : '') +
      '<p class="label">Students</p><div class="grid2">' + d.students.map(s => { const L = by[s.name], M = L.filter(x => !isSide(x)), n = M.length, avg = n ? Math.round(M.reduce((a,x)=>a+pct(x),0)/n) : null;
        const c = (BOOKS[Object.keys(BOOKS).find(k => s.book.toLowerCase().includes(k))] || ['#6e6252'])[0];
        return '<div class="card stu" style="--c:'+c+'"><a href="'+qs({s:s.token})+'" style="text-decoration:none"><h3>'+esc(s.name)+'</h3><div class="muted small">'+esc(s.book)+'</div>' +
          '<div class="row" style="margin:12px 0"><span class="big" style="font-size:34px;color:'+(avg==null?'var(--muted)':bandColor(avg))+'">'+(avg==null?'—':avg+'%')+'</span><span class="muted small">'+n+' homework'+(n===1?'':'s')+'<br>'+L.filter(x=>x.status!=='checked').length+' to check · '+todoOf(s.token, L).length+' not done yet</span></div></a>' +
          '<button class="copy" data-l="'+esc(base+'?s='+s.token)+'">Copy student link</button></div>'; }).join('') + '</div>' +
      (lost.length ? '<p class="label">Name not recognised ('+lost.length+')</p><div class="note">'+lost.map(x => '“'+esc(x.typed||'(empty)')+'” — '+esc(x.homework)+', '+fmtDate(x.at)).join('<br>')+'<br><br>Add these spellings to “Aliases” in the Students tab of the “Homework Results DB” sheet.</div>' : '');
    document.querySelectorAll('.copy').forEach(b => b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(b.dataset.l); b.textContent = 'Copied ✓'; setTimeout(() => b.textContent = 'Copy student link', 1500); });
  });
}

/* ---------- demo data (?demo) ---------- */
function demoApi(p){
  const D = window.DEMO_DATA;
  if (p.action === 'teacher') return {ok:true, students:D.students, subs:D.subs};
  if (p.action === 'student'){ const st = D.students.find(s => s.token === p.token); return {ok:true, teacher:!!KEY, student:st, subs:D.subs.filter(x => x.who === st.name)}; }
  if (p.action === 'snaps') return {ok:true, snaps:(D.snaps[p.id] || [])};
  if (p.action === 'review') { const x = D.subs.find(s => s.id === p.id); x.status = p.status; x.comment = p.comment; return {ok:true}; }
}

/* ---------- start ---------- */
function route(){ loadAssign().then(() => { if (TOKEN) studentPage(); else if (KEY) teacherPage(); else fail(new Error('student')); }); }
window.addEventListener('hashchange', route);
if (DEMO){ const s = document.createElement('script'); s.src = 'demo-data.js'; s.onload = route; document.head.appendChild(s); } else route();
</script>
</body>
